apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admin-service
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: admin-service=005734394777.dkr.ecr.ap-northeast-2.amazonaws.com/adminservice
    argocd-image-updater.argoproj.io/admin-service.update-strategy: latest
spec:
  project: default
  source:
    repoURL: https://github.com/jaeilssss/ecommercial-msa-kubernetes
    path: helm/admin-service
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: production