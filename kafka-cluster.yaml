apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: my-cluster
  namespace: kafka
spec:
  kafka:
    version: 3.7.0
    replicas: 3
    listeners:
      - name: plain
        port: 9092
        type: loadbalancer   # 외부 접근을 원하면 NodePort or LoadBalancer
        tls: false
    storage:
      type: ephemeral        # 테스트용, 운영 시 persistent로 변경
  zookeeper:
    replicas: 3
    storage:
      type: ephemeral
  entityOperator:
    topicOperator: {}
    userOperator: {}