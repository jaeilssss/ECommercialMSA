spring:
  datasource:
    replication:
      driver-class-name: com.mysql.cj.jdbc.Driver
      username: ${db_username}
      password: ${db_password}
      write:
        name: write
        url: ${db_url}
      reads:
        - name: read1
          url: ${db_url}
  data:
    redis:
      port: 6379
      host: localhost
      connect-timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace

